<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>تدريب الصوت</title>
<link rel="stylesheet" href="voice.css?v=1">
</head>
<body>
<main class="vc">
  <nav class="vnav">
    <a href="./" id="toHifz">‹ تسميع</a>
    <button id="langBtn" class="vlang">English</button>
  </nav>
  <header class="vhead">
    <h1 data-t="title">تدريب الصوت</h1>
    <p data-t="sub"></p>
  </header>

  <!-- 1. choose -->
  <section id="vMenu">
    <div class="vcard vvoice">
      <span data-t="voiceType"></span>
      <div class="vseg"><button id="vLowV" data-t="voiceLow"></button><button id="vHighV" data-t="voiceHigh"></button></div>
      <p class="vsmall" id="vBaseText"></p>
    </div>
    <div id="vList"></div>
    <div class="vcard">
      <h2 data-t="progress"></h2>
      <canvas id="vProg" class="vprog"></canvas>
      <p class="vsmall" id="vProgText"></p>
    </div>
    <p class="vnote" data-t="note"></p>
  </section>

  <!-- 2. one exercise -->
  <section id="vEx" hidden>
    <div class="vcard">
      <h2 id="exTitle"></h2>
      <p id="exHow"></p>
    </div>
    <div class="vstage">
      <div class="vcue" id="vCue" aria-live="polite"></div>
      <canvas id="vChart" class="vchart"></canvas>
      <div class="vmeter"><span id="vLevel"></span></div>
      <div class="vnow"><span id="vNote">—</span><span id="vTimer"></span></div>
    </div>
    <div class="vscores" id="vScores" hidden>
      <div><b id="sPitch">—</b><span data-t="sPitch"></span></div>
      <div><b id="sWobble">—</b><span data-t="sWobble"></span></div>
      <div><b id="sBreath">—</b><span data-t="sBreath"></span></div>
      <div><b id="sLow">—</b><span data-t="sLow"></span></div>
    </div>
    <p class="vtip" id="vTip"></p>
    <button class="vbtn gold big" id="vGo"></button>
    <button class="vbtn" id="vBack" data-t="back"></button>
  </section>

  <!-- microphone explanation / problems -->
  <div class="vgate" id="vGate" hidden>
    <div class="vcard">
      <h2 data-t="micTitle"></h2>
      <p id="vGateText"></p>
      <button class="vbtn gold" id="vGateOk" data-t="micOk"></button>
      <button class="vbtn" id="vGateNo" data-t="back"></button>
    </div>
  </div>
</main>
<script src="pitch.js?v=2"></script>
<script src="voice.js?v=2"></script>
</body>
</html>
